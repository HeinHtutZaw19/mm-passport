name: Weekly ingest

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (10:00 KST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr
          pip install -q playwright
      - name: Download new photos
        run: HEADLESS=1 python download.py
      - name: OCR and merge into docs/data.json
        run: python extract.py
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet docs/data.json && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly ingest $(date -u +%F)" docs/data.json
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: photos
          path: photos/
